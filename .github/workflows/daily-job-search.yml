name: Daily Job Search

# يشغّل البوت تلقائيًا كل يوم الساعة 2:00 PM بتوقيت القاهرة
# GitHub Actions يستخدم UTC، لذلك 2 PM Cairo = 11 AM UTC أثناء التوقيت الصيفي.
on:
  schedule:
    - cron: "0 11 * * *"

  # يسمح بتشغيل البوت يدويًا من تبويب Actions للتجربة
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # يجيب الكود من الـ repository
      - name: Check out the repo
        uses: actions/checkout@v4

      # تثبيت Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # تثبيت المكتبات المطلوبة
      - name: Install dependencies
        run: pip install -r requirements.txt

      # استرجاع ذاكرة الوظائف التي تم إرسالها سابقًا
      - name: Restore seen-jobs memory
        uses: actions/cache@v4
        with:
          path: seen_jobs.json
          key: seen-jobs-${{ github.run_id }}
          restore-keys: |
            seen-jobs-

      # تشغيل البحث وإرسال الوظائف إلى Telegram
      - name: Run the job search
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_search.py
