name: Daily Job Search

# يشغّل البوت تلقائيًا كل يوم الساعة 2:00 PM بتوقيت القاهرة
on:
  schedule:
    - cron: "0 11 * * *"

  # يسمح بتشغيل البوت يدويًا من تبويب Actions للتجربة
  workflow_dispatch:

# السماح للـ GitHub Actions بتعديل الملفات وعمل push
permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # يجيب الكود من الـ repository
      - name: Check out the repo
        uses: actions/checkout@v4

      # تثبيت Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # تثبيت المكتبات المطلوبة
      - name: Install dependencies
        run: pip install -r requirements.txt

      # تشغيل البحث وإرسال الوظائف إلى Telegram
      - name: Run the job search
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_search.py

      # حفظ seen_jobs.json في الـ repository
      - name: Save seen-jobs memory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f seen_jobs.json

          git diff --cached --quiet || git commit -m "Update seen jobs memory"

          git push
